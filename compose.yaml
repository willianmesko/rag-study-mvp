services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-study-db
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      # 5432 is frequently occupied by another local Postgres instance.
      # Inside Docker PostgreSQL remains on 5432; only the host mapping changes.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

