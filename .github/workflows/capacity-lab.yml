name: Capacity lab

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded synthetic workload
        type: choice
        default: pilot
        options: [pilot, durable-pilot, sustained]
  push:
    branches: [main]
    paths:
      - "scripts/capacity/**"
      - "tests/capacity/**"
      - "apps/api/src/**"
      - "apps/api/Dockerfile"
      - "apps/api/tsconfig.runtime.json"
      - "packages/contracts/**"
      - "package-lock.json"
      - ".github/workflows/capacity-lab.yml"
      - "docs/operations/capacity-sustained-run.md"

permissions:
  contents: read

jobs:
  isolated-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.profile == 'sustained' || contains(github.event.head_commit.message, '[capacity-sustained]')) && 48 || 15 }}
    env:
      CAPACITY_PROFILE: ${{ inputs.profile || (contains(github.event.head_commit.message, '[capacity-sustained]') && 'sustained') || 'pilot' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - name: Validate lab guards and deterministic provider fixture
        run: node --test tests/capacity/lab.test.mjs
      - name: Build the actual API image with required native OCR checks
        run: docker build --tag lumora-api:capacity-ci --file apps/api/Dockerfile .
      - name: Run selected isolated workload
        run: node scripts/capacity/run.mjs --image lumora-api:capacity-ci --profile "$CAPACITY_PROFILE" --report-id ${{ github.sha }}
      - name: Prove the durable path with a separate short fixture
        if: env.CAPACITY_PROFILE == 'pilot'
        run: node scripts/capacity/run.mjs --image lumora-api:capacity-ci --profile durable-pilot --report-id ${{ github.sha }}-durable
      - name: Retain safe pilot measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-${{ github.sha }}
          path: reports/capacity/*.json
          if-no-files-found: warn
          retention-days: 30
