name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mcp-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/rag
      MCP_TEST_DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/rag
      AGENT_ACTION_TEST_DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare local Supabase authentication fixture
        run: docker exec -i ${{ job.services.postgres.id }} psql -U rag -d rag -v ON_ERROR_STOP=1 < tests/fixtures/supabase-auth.sql
      - run: npm run test:mcp:postgres
      - name: Validate operational alarms
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/ops/observability:/etc/lumora:ro" -w /etc/lumora
          prom/prometheus:v3.16.0 test rules alert-tests.yml
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run eval:harness -- --report reports/evaluation-history/harness-${{ github.sha }}.json
        env:
          EVAL_REQUIRE_PERFORMANCE_GATE: ${{ vars.EVAL_REQUIRE_PERFORMANCE_GATE }}
          EVAL_PERFORMANCE_BASELINE: ${{ vars.EVAL_PERFORMANCE_BASELINE }}
          EVAL_PERFORMANCE_CANDIDATE: ${{ vars.EVAL_PERFORMANCE_CANDIDATE }}
          EVAL_PERFORMANCE_LIMITS: ${{ vars.EVAL_PERFORMANCE_LIMITS }}
      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumora-evaluation-harness-${{ github.sha }}
          path: reports/evaluation-history/harness-${{ github.sha }}.json
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ux
      - name: Upload UX report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumora-ux-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
