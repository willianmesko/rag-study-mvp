name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  embedding-index-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: embedding_cutover_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d embedding_cutover_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/embedding_cutover_ci
      TEST_EMBEDDING_DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/embedding_cutover_ci
      REQUIRE_EMBEDDING_INDEX_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare isolated cutover authentication fixture
        run: docker exec -i ${{ job.services.postgres.id }} psql -U rag -d embedding_cutover_ci -v ON_ERROR_STOP=1 < tests/fixtures/supabase-auth.sql
      - run: npm run build:api
      - name: Migrate isolated cutover database
        run: npm run db:migrate
      - name: Verify embedding-index cutover without skips
        run: npm run test:embedding:index
  mcp-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/rag
      MCP_TEST_DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/rag
      AGENT_ACTION_TEST_DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare local Supabase authentication fixture
        run: docker exec -i ${{ job.services.postgres.id }} psql -U rag -d rag -v ON_ERROR_STOP=1 < tests/fixtures/supabase-auth.sql
      - run: npm run test:mcp:postgres
      - name: Verify Nest DI, Prisma policies and audit persistence on the migrated SQL schema
        env:
          PRISMA_PILOT_DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/prisma_pilot_ci
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U rag -d rag -v ON_ERROR_STOP=1 -c "CREATE DATABASE prisma_pilot_ci OWNER rag"
          docker exec -i ${{ job.services.postgres.id }} psql -U rag -d prisma_pilot_ci -v ON_ERROR_STOP=1 < tests/fixtures/supabase-auth.sql
          DATABASE_URL="$PRISMA_PILOT_DATABASE_URL" npm run db:migrate
          npm --workspace @rag-study/api run test:prisma
          mkdir -p reports/benchmarks
          npm --workspace @rag-study/api run bench:prisma:audit > reports/benchmarks/prisma-audit.txt
      - name: Upload Prisma audit query and connection measurements
        uses: actions/upload-artifact@v4
        with:
          name: prisma-audit-${{ github.sha }}
          path: reports/benchmarks/prisma-audit.txt
          if-no-files-found: error
      - name: Build and verify the minimal read-only MCP image
        run: |
          docker build --tag lumora-mcp:ci --file apps/api/Dockerfile.mcp .
          node scripts/check-mcp-runtime.mjs
      - name: Validate operational alarms
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/ops/observability:/etc/lumora:ro" -w /etc/lumora
          prom/prometheus:v3.16.0 test rules alert-tests.yml
      - name: Prepare isolated API-image migration fixture
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U rag -d rag -v ON_ERROR_STOP=1 -c "CREATE DATABASE runtime_artifact_ci OWNER rag"
          docker exec -i ${{ job.services.postgres.id }} psql -U rag -d runtime_artifact_ci -v ON_ERROR_STOP=1 < tests/fixtures/supabase-auth.sql
      - name: Build and verify actual API-image migration resources
        env:
          RUNTIME_MIGRATION_TEST_DATABASE_URL: postgresql://rag:rag@127.0.0.1:5432/runtime_artifact_ci
        run: |
          docker build --tag lumora-api:ci --file apps/api/Dockerfile .
          node scripts/check-api-migrations.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce module boundaries and validate architecture fixtures
        run: |
          npm run check:architecture
          npm run test:architecture
      - run: npm run eval:harness -- --report reports/evaluation-history/harness-${{ github.sha }}.json
        env:
          EVAL_REQUIRE_PERFORMANCE_GATE: ${{ vars.EVAL_REQUIRE_PERFORMANCE_GATE }}
          EVAL_PERFORMANCE_BASELINE: ${{ vars.EVAL_PERFORMANCE_BASELINE }}
          EVAL_PERFORMANCE_CANDIDATE: ${{ vars.EVAL_PERFORMANCE_CANDIDATE }}
          EVAL_PERFORMANCE_LIMITS: ${{ vars.EVAL_PERFORMANCE_LIMITS }}
      - name: Verify native state, runtime artifacts and frontend budgets
        run: |
          npm run test:capacity
          npm run test:frontend-state
          npm run test:runtime-artifacts
          npm run test:frontend-budget
          npm run check:frontend-budget -- --report reports/frontend-performance/runs/build-${{ github.sha }}.json
      - name: Upload frontend build measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumora-frontend-build-${{ github.sha }}
          path: reports/frontend-performance/runs/build-${{ github.sha }}.json
          if-no-files-found: warn
      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumora-evaluation-harness-${{ github.sha }}
          path: reports/evaluation-history/harness-${{ github.sha }}.json
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ux
      - name: Upload UX report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumora-ux-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload frontend browser measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumora-frontend-browser-${{ github.sha }}
          path: test-results/**/frontend-performance.json
          if-no-files-found: warn
