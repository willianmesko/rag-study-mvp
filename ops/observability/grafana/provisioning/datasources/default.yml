apiVersion: 1
datasources:
  - name: Lumora metrics
    uid: lumora-metrics
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Lumora traces
    uid: lumora-traces
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
