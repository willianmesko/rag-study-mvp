services:
  - type: web
    runtime: static
    name: rag-study-demo-web
    buildCommand: npm ci && npm run build:web
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rag-study-demo-api-4ae2.onrender.com
      - key: VITE_DEMO_MODE
        value: "true"
  - type: web
    runtime: docker
    name: rag-study-demo-api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "true"
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: CHAT_PROVIDER
        value: openrouter
      - key: RERANKER_PROVIDER
        value: none
      - key: LANGSMITH_TRACING
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
